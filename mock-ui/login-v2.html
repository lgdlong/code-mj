<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>marjames — đăng nhập</title>
<style>
  :root {
    --bg: #101010;
    --ink: #ffffff;
    --muted: #7a7f85;
    --accent: #ff7300;
    --pad: 20px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --t-ui: 160ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .screen {
    min-height: 100svh;
    padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .gate { max-width: 460px; }

  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img {
    display: block; flex: none;
    width: 58px; height: 61px; object-fit: contain;
  }
  .words { min-width: 0; }
  .wordmark {
    margin: 0;
    font-size: 13vw;
    line-height: .84;
    font-weight: 800;
    letter-spacing: -0.045em;
    white-space: nowrap;
  }
  .credit {
    display: inline-block;
    margin-top: 9px;
    font-size: 13px; font-weight: 500; line-height: 1.2;
    color: var(--muted); text-decoration: none;
    transition: color var(--t-ui) var(--ease);
  }
  .credit:hover, .credit:focus-visible { color: var(--ink); }

  .action { margin-top: 30px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 54px; padding: 0 22px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: #101010;
    font-family: inherit; font-size: 15.5px; font-weight: 600;
    line-height: 1; letter-spacing: -0.01em;
    transition: transform var(--t-ui) var(--ease), background var(--t-ui) linear;
  }
  .btn:hover { background: #e6e6e6; }
  .btn:active { transform: scale(.985); }
  .btn svg { flex: none; }
  .rise { animation: rise 820ms var(--ease) both; }
  .fade { animation: fade 620ms var(--ease) both; }
  .d1 { animation-delay: 60ms; }
  .d2 { animation-delay: 130ms; }
  .d3 { animation-delay: 200ms; }
  .d4 { animation-delay: 270ms; }
  .d5 { animation-delay: 340ms; }
  .d6 { animation-delay: 400ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(34px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @media (min-width: 900px) {
    :root { --pad: 32px; }
    .gate { max-width: 560px; }
    .lockup { gap: 20px; }
    .lockup img { width: 76px; height: 80px; }
    .wordmark { font-size: min(6.4vw, 92px); }
    .credit { font-size: 14px; margin-top: 12px; }
    .action { margin-top: 36px; max-width: 420px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="screen">
  <div class="gate">
    <div class="lockup">
      <img class="rise" src="logo.png" alt="marjames" width="76" height="80">
      <div class="words">
        <h1 class="wordmark rise d1">marjames</h1>
        <a class="credit fade d2" href="https://www.threads.com/@thienthansangaa_" target="_blank" rel="noopener noreferrer">@thienthansangaa_</a>
      </div>
    </div>

    <div class="action">
      <button class="btn rise d3" type="button">
        <svg class="glyph fade d4" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#101010" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37a13 13 0 1 1 0-26c3.1 0 6 1.1 8.2 3.1l6.1-6.1A21.6 21.6 0 0 0 24 2a22 22 0 1 0 0 44c12.7 0 21.5-8.9 21.5-21.5 0-1.5-.2-3-.5-4.5Z"/>
        </svg>
        <span class="btn-label fade d5">Tiếp tục bằng Google</span>
      </button>
    </div>
  </div>
</main>
</body>
</html>
