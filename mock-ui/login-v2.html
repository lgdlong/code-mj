<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>marjames — đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101010;
    --ink: #ffffff;
    --muted: #7a7f85;
    --accent: #ff7300;
    --pad: 20px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --t-ui: 160ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .screen {
    min-height: 100svh;
    padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .gate { max-width: 460px; }

  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img {
    display: block; flex: none;
    width: 58px; height: 61px; object-fit: contain;
  }
  .words { min-width: 0; }
  .wordmark {
    margin: 0;
    font-size: 13vw;
    line-height: .84;
    font-weight: 800;
    letter-spacing: -0.045em;
    white-space: nowrap;
  }
  .credit {
    display: inline-block;
    margin-top: 9px;
    font-size: 13px; font-weight: 500; line-height: 1.2;
    color: var(--muted); text-decoration: none;
    transition: color var(--t-ui) var(--ease);
  }
  .credit:hover, .credit:focus-visible { color: var(--ink); }

  .action { margin-top: 30px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 54px; padding: 0 22px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: #101010;
    font-family: inherit; font-size: 15.5px; font-weight: 600;
    line-height: 1; letter-spacing: -0.01em;
    transition: transform var(--t-ui) var(--ease), background var(--t-ui) linear;
  }
  .btn:hover { background: #e6e6e6; }
  .btn:active { transform: scale(.985); }
  .btn svg { flex: none; }
  .rise { animation: rise 820ms var(--ease) backwards; }
  .fade { animation: fade 620ms var(--ease) backwards; }
  .d1 { animation-delay: 60ms; }
  .d2 { animation-delay: 130ms; }
  .d3 { animation-delay: 200ms; }
  .d4 { animation-delay: 270ms; }
  .d5 { animation-delay: 340ms; }
  .d6 { animation-delay: 400ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(34px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @media (min-width: 900px) {
    :root { --pad: 32px; }
    .screen { justify-content: flex-end; }
    .gate { max-width: 560px; }
    .lockup { gap: 20px; }
    .lockup img { width: 76px; height: 80px; }
    .wordmark { font-size: min(6.4vw, 92px); }
    .credit { font-size: 14px; margin-top: 12px; }
    .action { margin-top: 36px; max-width: 420px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="screen">
  <div class="gate">
    <div class="lockup">
      <img class="rise" src="logo.png" alt="marjames" width="76" height="80">
      <div class="words">
        <h1 class="wordmark rise d1">marjames</h1>
        <a class="credit fade d2" href="https://www.threads.com/@thienthansangaa_" target="_blank" rel="noopener noreferrer">@thienthansangaa_</a>
      </div>
    </div>

    <div class="action">
      <button class="btn rise d3" type="button">
        <svg class="glyph fade d4" width="19" height="19" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19Z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
        </svg>
        <span class="btn-label fade d5">Tiếp tục bằng Google</span>
      </button>
    </div>
  </div>
</main>
</body>
</html>
